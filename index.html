const d = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function open_(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: d(P.s), iterations: P.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: d(P.i) }, key, d(P.c));
  return new TextDecoder().decode(plain);
}
async function go(pw, remember) {
  const html = await open_(pw);
  try { if (remember) sessionStorage.setItem('rr_pw', pw); } catch (e) {}
  document.open(); document.write(html); document.close();
}
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const b = document.getElementById('b'), e = document.getElementById('e');
  b.disabled = true; e.textContent = '';
  try { await go(document.getElementById('pw').value, document.getElementById('keep').checked); }
  catch (x) { e.textContent = 'Şifre hatalı.'; b.disabled = false; }
});
(async () => { try { const s = sessionStorage.getItem('rr_pw'); if (s) await go(s, false); } catch (e) {} })();
